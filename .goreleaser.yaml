version: 2

before:
  hooks:
    - go mod tidy
    - make deps:explorer

builds:
  # Minimal build with no extras
  - id: "defradb_lite"
    main: ./cmd/defradb
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
  # Default build with explorer and telemetry
  - id: "defradb"
    main: ./cmd/defradb
    flags:
      - -tags=explorer,telemetry
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

partial:
  by: target

# Signing and notarization are skipped until the MACOS_SIGN_P12 secret is set,
# so releases work while the Apple certificates are pending. Once the MACOS_*
# secrets are added this activates on its own; also remove the quarantine
# hook from homebrew_casks at that point.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - defradb
      sign:
        certificate: '{{ envOrDefault "MACOS_SIGN_P12" "" }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        wait: true

archives:
  - id: defradb_lite
    builds:
      - defradb_lite
    formats: [binary]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .Binary }}_lite_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: defradb
    builds:
      - defradb
    formats: [binary]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  # tar.gz archive consumed by the Homebrew formula.
  - id: defradb_archive
    builds:
      - defradb
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

dmg:
  - id: defradb_dmg
    ids:
      - defradb
    name: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    extra_files:
      - README.md
      - licenses/BSL.txt

homebrew_casks:
  - name: defradb
    ids:
      - defradb_archive
    binaries:
      - defradb
    repository:
      owner: sourcenetwork
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sourcenetwork/defradb
    description: User-centric database prioritizing data ownership, privacy, and security
    license: BUSL-1.1
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binaries are not yet signed/notarized, so Gatekeeper quarantines
    # them and macOS reports them as damaged. Strip the quarantine attribute
    # on install; remove this hook once notarization is enabled.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/defradb"]
          end

release:
  target_commitish: "{{ .Commit }}"
  header: >
    DefraDB v{{ .Major }}.{{ .Minor }} is a major pre-production release.
    Until the stable version 1.0 is reached, the SemVer minor patch number will denote notable releases,
    which will give the project freedom to experiment and explore potentially breaking changes.

    To get a full outline of the changes, we invite you to review the official changelog below.
    This release does include a Breaking Change to existing v{{ .Major }}.{{ .Minor }}.x databases.
    If you need help migrating an existing deployment, reach out at hello@source.network or join
    our Discord at https://source.network/discord.

  name_template: "v{{ .Version }} Release"

changelog:
  sort: asc
  abbrev: -1
  groups:
    - title: Features
      regexp: "^feat:.*"
      order: 0
    - title: Fix
      regexp: "^fix:.*"
      order: 1
    - title: Tooling
      regexp: "^tools:.*"
      order: 2
    - title: Documentation
      regexp: "^docs:.*"
      order: 3
    - title: Refactoring
      regexp: "^refactor:.*"
      order: 4
    - title: Testing
      regexp: "^test:.*"
      order: 5

source:
  enabled: true

milestones:
  - close: true
    fail_on_error: false
    name_template: "DefraDB v{{ .Major }}.{{ .Minor }}"
