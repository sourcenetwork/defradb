<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- Accent bar -->
  <rect y="190" width="900" height="10" rx="0" fill="url(#accentGrad)"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="100" r="60" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.3"/>
  <circle cx="80" cy="100" r="40" fill="none" stroke="#533483" stroke-width="1" opacity="0.4"/>
  <circle cx="820" cy="100" r="55" fill="none" stroke="#533483" stroke-width="1.5" opacity="0.3"/>
  <circle cx="820" cy="100" r="35" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>

  <!-- Git branch decorative lines -->
  <line x1="150" y1="160" x2="750" y2="160" stroke="#e94560" stroke-width="2" opacity="0.2"/>
  <circle cx="250" cy="160" r="4" fill="#e94560" opacity="0.4"/>
  <circle cx="450" cy="160" r="4" fill="#533483" opacity="0.4"/>
  <circle cx="650" cy="160" r="4" fill="#e94560" opacity="0.4"/>
  <line x1="250" y1="160" x2="300" y2="140" stroke="#533483" stroke-width="1.5" opacity="0.2"/>
  <line x1="300" y1="140" x2="400" y2="140" stroke="#533483" stroke-width="1.5" opacity="0.2"/>
  <line x1="400" y1="140" x2="450" y2="160" stroke="#533483" stroke-width="1.5" opacity="0.2"/>

  <!-- Code symbols -->
  <text x="60" y="108" font-family="monospace" font-size="28" fill="#e94560" opacity="0.5">&lt;/&gt;</text>
  <text x="800" y="108" font-family="monospace" font-size="24" fill="#533483" opacity="0.5">{ }</text>

  <!-- Title -->
  <text x="450" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="2">
    Contributing to DefraDB
  </text>

  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a0a0c0" letter-spacing="1">
    Build the future of decentralized databases — together
  </text>
</svg>
