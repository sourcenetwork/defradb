<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" rx="10" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#c9d1d9">Fork Flow — Step by Step</text>

  <!-- Row 1: Steps 1-3 -->

  <!-- Step 1: Fork -->
  <rect x="30" y="60" width="220" height="55" rx="8" fill="#21262d" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560" font-weight="bold">STEP 1</text>
  <text x="140" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🍴 Fork the repo</text>

  <!-- Arrow -->
  <line x1="250" y1="87" x2="280" y2="87" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Clone -->
  <rect x="285" y="60" width="220" height="55" rx="8" fill="#21262d" stroke="#533483" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#533483" font-weight="bold">STEP 2</text>
  <text x="395" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">📥 Clone your fork</text>

  <!-- Arrow -->
  <line x1="505" y1="87" x2="535" y2="87" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Branch -->
  <rect x="540" y="60" width="230" height="55" rx="8" fill="#21262d" stroke="#238636" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#238636" font-weight="bold">STEP 3</text>
  <text x="655" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🌿 Create feature branch</text>

  <!-- Arrow down -->
  <line x1="655" y1="115" x2="655" y2="145" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Row 2: Steps 4-6 (right to left) -->

  <!-- Step 4: Code -->
  <rect x="540" y="150" width="230" height="55" rx="8" fill="#21262d" stroke="#1f6feb" stroke-width="2" filter="url(#shadow)"/>
  <text x="655" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f6feb" font-weight="bold">STEP 4</text>
  <text x="655" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">💻 Make changes</text>

  <!-- Arrow left -->
  <line x1="540" y1="177" x2="510" y2="177" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Step 5: Verify -->
  <rect x="285" y="150" width="220" height="55" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0883e" font-weight="bold">STEP 5</text>
  <text x="395" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">✅ Run checks</text>

  <!-- Arrow left -->
  <line x1="285" y1="177" x2="255" y2="177" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Step 6: PR -->
  <rect x="30" y="150" width="220" height="55" rx="8" fill="#21262d" stroke="#238636" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="140" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#238636" font-weight="bold">STEP 6</text>
  <text x="140" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">📬 Open PR → <tspan font-family="monospace" fill="#238636">develop</tspan></text>

  <!-- Make checks detail box -->
  <rect x="30" y="235" width="740" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="#f0883e" font-weight="bold">Step 5 — Suggested Local Checks (before opening your PR)</text>
  <text x="90" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">make docs</text>
  <text x="245" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">make mocks</text>
  <text x="400" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">make lint</text>
  <text x="555" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">make tidy</text>
  <text x="710" y="295" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">make test</text>
</svg>
