<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="10" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#c9d1d9">Fork Flow — Step by Step</text>

  <!-- Step boxes -->
  <!-- Step 1: Fork -->
  <rect x="30" y="60" width="160" height="55" rx="8" fill="#21262d" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560" font-weight="bold">STEP 1</text>
  <text x="110" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🍴 Fork repo</text>

  <!-- Arrow -->
  <line x1="190" y1="87" x2="220" y2="87" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>

  <!-- Step 2: Clone -->
  <rect x="225" y="60" width="160" height="55" rx="8" fill="#21262d" stroke="#533483" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#533483" font-weight="bold">STEP 2</text>
  <text x="305" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">📥 Clone fork</text>

  <!-- Arrow -->
  <line x1="385" y1="87" x2="415" y2="87" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Branch -->
  <rect x="420" y="60" width="160" height="55" rx="8" fill="#21262d" stroke="#238636" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#238636" font-weight="bold">STEP 3</text>
  <text x="500" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🌿 Create branch</text>

  <!-- Arrow -->
  <line x1="580" y1="87" x2="610" y2="87" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Code -->
  <rect x="615" y="60" width="160" height="55" rx="8" fill="#21262d" stroke="#1f6feb" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f6feb" font-weight="bold">STEP 4</text>
  <text x="695" y="102" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">💻 Make changes</text>

  <!-- Arrow down -->
  <line x1="695" y1="115" x2="695" y2="145" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Test -->
  <rect x="615" y="150" width="160" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="2" filter="url(#shadow)"/>
  <text x="695" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#da3633" font-weight="bold">STEP 5</text>
  <text x="695" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🧪 Write tests</text>

  <!-- Arrow left -->
  <line x1="615" y1="177" x2="585" y2="177" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs><marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto-start-reverse"><polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/></marker></defs>

  <!-- Step 6: Verify -->
  <rect x="420" y="150" width="160" height="55" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#f0883e" font-weight="bold">STEP 6</text>
  <text x="500" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">✅ Run make checks</text>

  <!-- Arrow left -->
  <line x1="420" y1="177" x2="390" y2="177" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Step 7: Commit -->
  <rect x="225" y="150" width="160" height="55" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e" font-weight="bold">STEP 7</text>
  <text x="305" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">📝 Commit changes</text>

  <!-- Arrow left -->
  <line x1="225" y1="177" x2="195" y2="177" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Step 8: Push -->
  <rect x="30" y="150" width="160" height="55" rx="8" fill="#21262d" stroke="#e94560" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#e94560" font-weight="bold">STEP 8</text>
  <text x="110" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">🚀 Push to fork</text>

  <!-- Arrow down -->
  <line x1="110" y1="205" x2="110" y2="235" stroke="#484f58" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 9: PR -->
  <rect x="30" y="240" width="355" height="55" rx="8" fill="#21262d" stroke="#238636" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="207" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#238636" font-weight="bold">STEP 9</text>
  <text x="207" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c9d1d9">📬 Open PR targeting <tspan font-family="monospace" fill="#238636">develop</tspan> branch</text>

  <!-- Make checks detail box -->
  <rect x="30" y="320" width="745" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" font-family="monospace" font-size="12" fill="#f0883e" font-weight="bold">Step 6 — Required Local Checks (run before committing)</text>
  <text x="50" y="375" font-family="monospace" font-size="12" fill="#7ee787">make docs</text>
  <text x="165" y="375" font-family="monospace" font-size="12" fill="#7ee787">make mocks</text>
  <text x="287" y="375" font-family="monospace" font-size="12" fill="#7ee787">make lint</text>
  <text x="397" y="375" font-family="monospace" font-size="12" fill="#7ee787">make tidy</text>
  <text x="507" y="375" font-family="monospace" font-size="12" fill="#7ee787">make test</text>
  <text x="627" y="375" font-family="monospace" font-size="12" fill="#f0883e">make test:changes</text>
</svg>
