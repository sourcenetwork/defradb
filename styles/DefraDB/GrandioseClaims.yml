extends: existence
message: "Avoid unsupported claim '%s' - provide specific evidence or proof instead"
level: warning
link: https://github.com/sourcenetwork/defradb/blob/develop/CONTRIBUTING.md
ignorecase: true
scope: text
nonword: true
tokens:
